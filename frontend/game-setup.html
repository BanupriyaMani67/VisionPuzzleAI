<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game setup | VisionPuzzle</title><link rel="stylesheet" href="/css/global.css"></head><body class="auth-page"><nav><a class="brand" href="/">VISION<span>PUZZLE</span></a><a href="/dashboard.html">Dashboard</a></nav><section class="auth-card" style="max-width:700px"><p class="eyebrow">NEW PUZZLE</p><h1>Set the challenge.</h1><p>Choose your settings, then take your photo in the camera before solving.</p><form id="setup-form"><label>Difficulty<select name="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option><option value="expert">Expert</option></select></label><label>Puzzle size<select name="puzzleSize"><option value="3">3 x 3</option><option value="4">4 x 4</option><option value="5">5 x 5</option></select></label><label>Game mode<select name="gameMode"><option value="classic">Classic</option><option value="time">Time Challenge</option><option value="memory">Memory Challenge</option><option value="gesture">Gesture Challenge</option></select></label><p class="form-error" id="form-error"></p><button class="button" type="submit">Open camera <span>↗</span></button></form></section><script>const form=document.querySelector('#setup-form');form.addEventListener('submit',e=>{e.preventDefault();sessionStorage.removeItem('puzzleImage');sessionStorage.setItem('puzzleConfig',JSON.stringify(Object.fromEntries(new FormData(form))));location.href='/game.html'});</script></body></html>
