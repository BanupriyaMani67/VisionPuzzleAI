<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leaderboard | VisionPuzzle</title><link rel="stylesheet" href="/css/global.css"></head><body class="auth-page"><nav><a class="brand" href="/">VISION<span>PUZZLE</span></a><a href="/dashboard.html">Dashboard</a></nav><section class="auth-card" style="max-width:800px"><p class="eyebrow">LIVE RANKINGS</p><h1>Leaderboard.</h1><div id="rows" class="muted">Loading...</div></section><script src="/js/api.js"></script><script>api('/leaderboard').then(({leaderboard})=>document.querySelector('#rows').innerHTML=leaderboard.map((x,i)=>`<p><strong>#${i+1} ${escapeHtml(x.username)}</strong> · ${x.score} points · ${x.games} games · best ${x.bestTime}s</p>`).join('')||'Complete a puzzle to appear here.').catch(e=>document.querySelector('#rows').textContent=e.message)</script></body></html>
