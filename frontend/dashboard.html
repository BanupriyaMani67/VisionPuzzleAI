<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | VisionPuzzle</title><link rel="stylesheet" href="/css/global.css"><style>.dash{max-width:1100px;margin:auto;padding:25px 5vw}.dash nav{padding:0 0 45px}.dash h1{font:600 42px 'Space Grotesk';margin:10px 0}.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:30px 0}.dash-card{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}.dash-card small{color:var(--muted);display:block}.dash-card strong{font:600 30px 'Space Grotesk'}.dash-section{margin-top:32px}.dash-links{display:flex;gap:12px;flex-wrap:wrap}.dash-links a{border:1px solid var(--line);padding:12px 16px;border-radius:8px;font-weight:600;font-size:13px}@media(max-width:700px){.dash-grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><main class="dash"><nav><a class="brand" href="/">VISION<span>PUZZLE</span></a><div><a href="/profile.html">Profile</a><a href="#" id="logout">Log out</a></div></nav><p class="eyebrow">PLAYER CONTROL ROOM</p><h1>Welcome, <span id="username">player</span>.</h1><p class="muted">Your progress, your pace, your next move.</p><div class="dash-links"><a class="button" href="/game-setup.html">Play now <span>↗</span></a><a href="/history.html">Game history</a><a href="/leaderboard.html">Leaderboard</a></div><section class="dash-grid" id="stats"></section><section class="dash-section dash-card"><h2>Recent games</h2><div id="recent" class="muted">Loading your runs...</div></section></main><script src="/js/api.js"></script><script>async function load(){try{const me=await api('/auth/me');if(!me.user)return location.href='/login.html';document.querySelector('#username').textContent=escapeHtml(me.user.username);const data=await api('/games/stats');const s=data.stats;document.querySelector('#stats').innerHTML=[['GAMES PLAYED',s.gamesPlayed],['BEST SCORE',Math.round(s.bestScore)],['AVERAGE TIME',Math.round(s.averageTime)+'s'],['ACCURACY',Math.round(s.accuracy)+'%']].map(x=>`<div class="dash-card"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');document.querySelector('#recent').innerHTML=data.recent.map(g=>`${escapeHtml(g.difficulty)} · ${g.score} points · ${g.completion_time}s`).join('<br>')||'No games yet.'}catch(e){document.querySelector('#recent').textContent=e.message}}load();document.querySelector('#logout').onclick=async e=>{e.preventDefault();await api('/auth/logout',{method:'POST'});location.href='/'};</script></body></html>
