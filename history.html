<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>History | VisionPuzzle</title><link rel="stylesheet" href="/css/global.css"></head><body class="auth-page"><nav><a class="brand" href="/">VISION<span>PUZZLE</span></a><a href="/dashboard.html">Dashboard</a></nav><section class="auth-card" style="max-width:900px"><p class="eyebrow">YOUR RUNS</p><h1>Game history.</h1><label>Filter difficulty<select id="filter"><option value="">All difficulties</option><option>easy</option><option>medium</option><option>hard</option><option>expert</option></select></label><div id="rows" class="muted" style="margin-top:25px">Loading...</div></section><script src="/js/api.js"></script><script>async function load(){const f=document.querySelector('#filter').value;const {games}=await api('/games/history'+(f?'?difficulty='+f:''));document.querySelector('#rows').innerHTML=games.map(g=>`<p>${g.created_at} · ${g.difficulty} · ${g.puzzle_size}x${g.puzzle_size} · <strong>${g.score} points</strong> · ${g.completion_time}s · ${Math.round(g.accuracy)}%</p>`).join('')||'No games found.'}document.querySelector('#filter').onchange=load;load().catch(e=>document.querySelector('#rows').textContent=e.message)</script></body></html>
