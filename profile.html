<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | VisionPuzzle</title><link rel="stylesheet" href="/css/global.css"></head><body class="auth-page"><nav><a class="brand" href="/">VISION<span>PUZZLE</span></a><a href="/dashboard.html">Dashboard</a></nav><section class="auth-card"><p class="eyebrow">PLAYER PROFILE</p><h1>Your profile.</h1><form id="profile"><label>Name<input name="name" required></label><label>Username<input name="username" required></label><label>Email<input name="email" disabled></label><p id="message" class="form-error"></p><button class="button">Save changes</button></form><h2>Achievements</h2><div id="achievements" class="muted">Loading...</div></section><script src="/js/api.js"></script><script>async function load(){const d=await api('/user/profile');for(const key of ['name','username','email'])document.querySelector(`[name=${key}]`).value=d.user[key];document.querySelector('#achievements').innerHTML=d.achievements.map(a=>`<p><strong>${escapeHtml(a.name)}</strong> · ${escapeHtml(a.description)}</p>`).join('')||'Keep playing to unlock achievements.'}load().catch(e=>document.querySelector('#message').textContent=e.message);document.querySelector('#profile').onsubmit=async e=>{e.preventDefault();try{await api('/user/profile',{method:'PUT',body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget))) });document.querySelector('#message').textContent='Profile updated.'}catch(error){document.querySelector('#message').textContent=error.message}}</script></body></html>
