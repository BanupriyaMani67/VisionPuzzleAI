<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Results | VisionPuzzle</title><link rel="stylesheet" href="/css/global.css"></head><body class="auth-page"><section class="auth-card" style="max-width:700px;text-align:center"><p class="eyebrow">RUN COMPLETE</p><h1>Puzzle solved.</h1><p class="muted">Your latest result has been saved to your profile.</p><div id="result" class="metrics"></div><a class="button" href="/game-setup.html">Play again <span>↗</span></a><a class="text-link" href="/dashboard.html" style="display:block;margin-top:24px">Back to dashboard</a></section><script>const data=JSON.parse(sessionStorage.getItem('lastResult')||'{}');document.querySelector('#result').innerHTML=[['SCORE',data.score],['TIME',data.completionTime+'s'],['MOVES',data.moves],['ACCURACY',Math.round(data.accuracy)+'%']].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]??'-'}</strong></div>`).join('')</script></body></html>
