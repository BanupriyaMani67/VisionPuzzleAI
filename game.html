<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Play | VisionPuzzle</title><link rel="stylesheet" href="/css/global.css"><style>.game-shell{max-width:1180px;margin:auto;padding:20px 5vw 60px}.game-top{display:flex;justify-content:space-between;align-items:center}.game-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:25px}.game-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.camera-wrap{position:relative;background:#211d2b;border-radius:10px;overflow:hidden;aspect-ratio:4/3}.camera-wrap video,.camera-wrap canvas{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}.camera-wrap canvas{position:absolute;inset:0}.status{display:flex;justify-content:space-between;margin-top:14px;font-size:13px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.metric{padding:12px;background:var(--lilac);border-radius:8px}.metric small{display:block;color:var(--muted);font-size:10px}.metric strong{font:600 22px 'Space Grotesk'}.board{width:100%;aspect-ratio:1;background:#f1e9f2;border-radius:10px;display:block}.notice{color:#b52c51;min-height:20px;font-size:13px}.capture-button{margin:15px 0 0 10px}.capture-button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}@media(max-width:800px){.game-grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}} </style></head><body><main class="game-shell"><div class="game-top"><a class="brand" href="/">VISION<span>PUZZLE</span></a><a href="/dashboard.html">Exit game</a></div><div class="game-grid"><section class="game-panel"><div class="camera-wrap"><video id="camera" autoplay playsinline muted></video><canvas id="landmarks"></canvas></div><div class="status"><span id="hand-status">Start the camera to take your photo</span><strong id="gesture">PHOTO FIRST</strong></div><button class="button" id="camera-button" style="margin-top:15px">Start camera</button><button class="button capture-button" id="capture-button" disabled>Take photo</button></section><section class="game-panel"><canvas class="board" id="puzzle" width="600" height="600"></canvas><div class="metrics"><div class="metric"><small>TIME</small><strong id="time">00:00</strong></div><div class="metric"><small>MOVES</small><strong id="moves">0</strong></div><div class="metric"><small>MISTAKES</small><strong id="mistakes">0</strong></div><div class="metric"><small>ACCURACY</small><strong id="accuracy">100%</strong></div></div><p class="notice" id="game-error">Take a photo first. Your photo will become the puzzle.</p></section></div></main><script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script><script type="module" src="/js/game.js"></script></body></html>
